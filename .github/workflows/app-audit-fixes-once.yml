name: App audit fixes once

on:
  push:
    branches:
      - codex/mapa-mundo-webapp
    paths:
      - .github/workflows/app-audit-fixes-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audit-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/mapa-mundo-webapp

      - name: Apply minimal audited fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "index.html",
              'content="Web app para visualizar datos meteorologicos historicos diarios por ciudad usando NASA POWER."',
              'content="Web app para visualizar meteorología diaria con NASA POWER, sismos USGS, placas PB2002 y fase lunar aproximada por ciudad."',
          )
          replace_exact("index.html", "NASA POWER</p>", "NASA POWER · USGS</p>")
          replace_exact("index.html", "Cargando últimos terremotos M7+...", "Cargando terremotos M7+ desde 1900...")
          replace_exact("index.html", "Filtrar puntos cercanos visualmente a placas", "Filtrar ciudades a 300 km de placas")

          replace_exact(
              "assets/app.js",
              'elements.mapTitle.textContent = "Mapa oficial de referencia mundial";',
              'elements.mapTitle.textContent = "Mapa de referencia mundial";',
          )

          old_style = '''  style.textContent = `
              .country{fill:#f7f5ec;stroke:#bec8c9;stroke-width:.45}
              .metric-area{mix-blend-mode:multiply;opacity:.38}
              .city-dot{fill:#102b35;stroke:#fff;stroke-width:1.15}
              .city-label{paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px;fill:#102b35;font-size:10px;font-weight:800;font-family:Arial,sans-serif}
            `;'''
          new_style = '''  style.textContent = `
              .country{fill:#f7f5ec;stroke:#bec8c9;stroke-width:.45}
              .metric-area{mix-blend-mode:multiply;opacity:.38}
              .city-dot{fill:#102b35;stroke:#fff;stroke-width:1.15}
              .city-label{paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px;fill:#102b35;font-size:10px;font-weight:800;font-family:Arial,sans-serif}
              .tectonic-plate-boundary-shadow{fill:none;stroke:rgba(255,255,255,.92);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
              .tectonic-plate-boundary{fill:none;stroke:#6f1111;stroke-width:1.35;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
              .earthquake-dot{stroke:#fff;stroke-width:1.8;pointer-events:none}
              .earthquake-label{paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:4px;fill:#151515;font-size:11px;font-weight:900;font-family:Arial,sans-serif;pointer-events:none}
              .moon-phase-marker{pointer-events:none}
              .moon-phase-marker circle,.moon-phase-marker path{shape-rendering:geometricPrecision}
            `;'''
          replace_exact("assets/app.js", old_style, new_style)
          PY

      - name: Validate syntax and expected markers
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/earthquake-presets.js
          node --check assets/earthquake-catalog-async.js
          grep -n "Mapa de referencia mundial" index.html assets/app.js
          grep -n "Cargando terremotos M7+ desde 1900" index.html
          grep -n "Filtrar ciudades a 300 km de placas" index.html
          grep -n "tectonic-plate-boundary" assets/app.js
          grep -n "earthquake-dot" assets/app.js
          grep -n "moon-phase-marker" assets/app.js
          if grep -q "Mapa oficial de referencia mundial" assets/app.js; then
            echo "Texto oficial residual detectado" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/app-audit-fixes-once.yml
          git status --short

      - name: Commit audited fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.js .github/workflows/app-audit-fixes-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: clarify labels and PNG export styles"
          git push origin HEAD:codex/mapa-mundo-webapp
