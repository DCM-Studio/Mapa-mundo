name: Active epicenter map once

on:
  push:
    branches:
      - codex/mapa-mundo-webapp
    paths:
      - .github/workflows/active-epicenter-map-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-active-epicenter-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/mapa-mundo-webapp

      - name: Patch interactive map city selection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          old_app = '''function initializeStaticDataApi() {
            const existingApi = window.MapaMundoStaticData || {};
            const api = {
              ...existingApi,
              baseCities: CITIES,
              earthquakeEpicenterCities: Array.isArray(existingApi.earthquakeEpicenterCities)
                ? existingApi.earthquakeEpicenterCities
                : [],
              get cities() {
                return this.getCities();
              },
              getCities() {
                return combineCities(CITIES, this.earthquakeEpicenterCities || []);
              },
              setEarthquakeEpicenters(events) {
                this.earthquakeEpicenterCities = normalizeEpicenterCities(events);
                window.dispatchEvent(new CustomEvent("mapaMundo:citiesChanged", {
                  detail: {
                    baseCities: CITIES.length,
                    epicenterCities: this.earthquakeEpicenterCities.length,
                    totalCities: this.getCities().length,
                  },
                }));
                return this.earthquakeEpicenterCities;
              },
            };

            window.MapaMundoStaticData = api;
            return api;
          }

          function getAnalysisCities() {
            return DATA_API?.getCities ? DATA_API.getCities() : CITIES;
          }
          '''
          new_app = '''function initializeStaticDataApi() {
            const existingApi = window.MapaMundoStaticData || {};
            const api = {
              ...existingApi,
              baseCities: CITIES,
              earthquakeEpicenterCities: Array.isArray(existingApi.earthquakeEpicenterCities)
                ? existingApi.earthquakeEpicenterCities
                : [],
              get cities() {
                return this.getCities();
              },
              getCities() {
                return combineCities(CITIES, getActiveEpicenterCities(this.earthquakeEpicenterCities || []));
              },
              getAllCatalogCities() {
                return combineCities(CITIES, this.earthquakeEpicenterCities || []);
              },
              setEarthquakeEpicenters(events) {
                this.earthquakeEpicenterCities = normalizeEpicenterCities(events);
                window.dispatchEvent(new CustomEvent("mapaMundo:citiesChanged", {
                  detail: {
                    baseCities: CITIES.length,
                    epicenterCities: this.earthquakeEpicenterCities.length,
                    totalCities: this.getCities().length,
                    totalCatalogCities: this.getAllCatalogCities().length,
                  },
                }));
                return this.earthquakeEpicenterCities;
              },
            };

            window.MapaMundoStaticData = api;
            return api;
          }

          function getAnalysisCities() {
            return DATA_API?.getCities ? DATA_API.getCities() : CITIES;
          }

          function getActiveEpicenterCities(epicenterCities) {
            const selected = getSelectedEarthquakePreset();
            if (!selected) return [];

            const selectedId = String(selected.value || "");
            const selectedDate = selected.dataset.date || "";
            return epicenterCities.filter((city) => {
              const idMatches = selectedId && String(city.earthquakeId || "") === selectedId;
              const dateMatches = selectedDate && String(city.earthquakeDate || "").slice(0, 10) === selectedDate;
              return idMatches || dateMatches;
            }).slice(0, 1);
          }

          function getSelectedEarthquakePreset() {
            const select = document.getElementById("earthquakePresetSelect");
            const option = select?.selectedOptions?.[0];
            return option?.dataset?.date ? option : null;
          }
          '''
          replace_exact("assets/app.js", old_app, new_app)

          replace_exact(
              "README.md",
              "- NASA POWER entrega datos por coordenada. Cargar literalmente todas las ciudades del mundo desde el navegador produciria miles de solicitudes y podria ser bloqueado. Esta version usa una lista curada de ciudades principales y suma los epicentros USGS M7+ disponibles en el desplegable historico.",
              "- NASA POWER entrega datos por coordenada. Cargar literalmente todas las ciudades del mundo desde el navegador produciria miles de solicitudes y podria ser bloqueado. La vista interactiva usa una lista curada de ciudades principales y, al elegir un terremoto M7+, suma solo ese epicentro seleccionado; la exportacion historica M7+ de servidor recorre el catalogo completo.",
          )
          PY

      - name: Validate syntax and markers
        run: |
          set -euo pipefail
          node --check assets/app.js
          grep -n "getActiveEpicenterCities" assets/app.js
          grep -n "getSelectedEarthquakePreset" assets/app.js
          grep -n "getAllCatalogCities" assets/app.js
          grep -n "totalCatalogCities" assets/app.js
          grep -n "suma solo ese epicentro seleccionado" README.md
          if grep -q "return combineCities(CITIES, this.earthquakeEpicenterCities || \[\]);" assets/app.js; then
            echo "Interactive map still combines all M7+ epicenters" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/active-epicenter-map-once.yml
          git status --short

      - name: Commit active epicenter fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js README.md .github/workflows/active-epicenter-map-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: limit map to selected M7 epicenter"
          git push origin HEAD:codex/mapa-mundo-webapp
