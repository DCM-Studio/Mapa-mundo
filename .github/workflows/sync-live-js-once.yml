name: Sync live JS once

on:
  push:
    branches:
      - codex/mapa-mundo-webapp
    paths:
      - .github/workflows/sync-live-js-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-live-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/mapa-mundo-webapp

      - name: Download live Bluehost JS snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-js
          curl -fL --retry 3 --retry-delay 2 -o /tmp/live-js/app.js "https://dcm.cl/Mapa-mundo/exports/live-js-sync-20260629_191206/app.js"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/live-js/earthquake-presets.js "https://dcm.cl/Mapa-mundo/exports/live-js-sync-20260629_191206/earthquake-presets.js"

      - name: Validate live snapshot checksums and syntax
        run: |
          set -euo pipefail
          echo "3b44e561e828a364f3c68ec19ec7eacf33e45563289e445d39aff560037ed453  /tmp/live-js/app.js" | sha256sum -c -
          echo "ea9476dcb744503eb76707150e2fbba2e473b9fba3112bbd077b5b00e42f8b69  /tmp/live-js/earthquake-presets.js" | sha256sum -c -
          node --check /tmp/live-js/app.js
          node --check /tmp/live-js/earthquake-presets.js
          wc -l /tmp/live-js/app.js /tmp/live-js/earthquake-presets.js

      - name: Install live JS and remove one-time workflow
        run: |
          set -euo pipefail
          cp /tmp/live-js/app.js assets/app.js
          cp /tmp/live-js/earthquake-presets.js assets/earthquake-presets.js
          rm -f .github/workflows/sync-live-js-once.yml
          git status --short

      - name: Commit synced JS
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/earthquake-presets.js .github/workflows/sync-live-js-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync live JS hotfixes from Bluehost"
          git push origin HEAD:codex/mapa-mundo-webapp
